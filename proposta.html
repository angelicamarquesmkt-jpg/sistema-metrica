<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Proposta · Métrica Digital</title>
<link rel="icon" type="image/png" href="assets/marca/icone-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ac:#FF5A1F;--ac2:#E8251F;--amb:#FF8A1F;--ink:#15110F;--ink2:#211A17;--ink3:#2C2420;--cream:#FBF6F1;--cream2:#F3EBE3;--fg:#1C1714;--muted:#7A6F69;--sub:#BFB3AC;--line:#E9E1DB;--ok:#13834B;--okl:#5FD69A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0B0908;color:#fff;font:16px/1.55 Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
.deck{position:fixed;inset:0}
.slide{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;opacity:0;visibility:hidden;transition:opacity .5s ease,visibility .5s;-webkit-overflow-scrolling:touch}
.slide.on{opacity:1;visibility:visible}
.slide.light{background:var(--cream);color:var(--fg)}
.slide.dark{background:radial-gradient(1200px 700px at 85% -10%,#2A1C15 0%,var(--ink) 55%)}
.in{min-height:100%;max-width:1200px;margin:0 auto;padding:76px 32px 110px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1}
@media (max-width:760px){.in{padding:66px 18px 120px;justify-content:flex-start}}
/* animação de entrada */
.a{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--d,0) * 90ms + 150ms)}
.slide.on .a{opacity:1;transform:none}
.a.l{transform:translateX(-30px)}.a.r{transform:translateX(30px)}.a.s{transform:scale(.92)}
.slide.on .a.l,.slide.on .a.r,.slide.on .a.s{transform:none}
.kick{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);margin:0 0 14px}
h1,h2{font-weight:800;letter-spacing:-.025em;margin:0 0 18px;line-height:1.06}
h1{font-size:clamp(38px,5.6vw,70px)}
h2{font-size:clamp(30px,4.2vw,54px)}
h3{font-size:18px;font-weight:700;margin:0 0 6px;line-height:1.3}
.lead{font-size:clamp(16px,1.6vw,19px);color:var(--sub);max-width:600px;margin:0 0 10px}
.light .lead{color:var(--muted)}
.hl{color:var(--ac)}
.ul{position:relative;white-space:nowrap}
.ul::after{content:"";position:absolute;left:0;right:0;bottom:.02em;height:.09em;background:var(--ac);border-radius:4px;transform:scaleX(0);transform-origin:left;transition:transform .9s .8s cubic-bezier(.2,.7,.2,1)}
.slide.on .ul::after{transform:scaleX(1)}
.logo{width:96px;height:auto;display:block;margin:0 0 30px}
.top-logo{position:fixed;top:18px;left:22px;z-index:20;display:flex;align-items:center;gap:10px;transition:opacity .3s}
.top-logo img{width:30px}
.top-logo span{font-weight:700;font-size:13.5px}
.top-logo.hide{opacity:0;pointer-events:none}
body.lt .top-logo span{color:var(--fg)}
.nav{position:fixed;right:20px;bottom:20px;z-index:40;display:flex;align-items:center;gap:10px}
.nav button{width:50px;height:50px;border-radius:50%;border:0;background:#fff;color:var(--ink);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:transform .2s}
.nav button:hover{transform:scale(1.06)}
.nav button.go{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.nav button[disabled]{opacity:.35;cursor:default;transform:none}
.count{font-size:13px;font-weight:600;color:var(--sub);min-width:46px;text-align:center}
body.lt .count{color:var(--muted)}
.dots{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);display:flex;gap:6px;z-index:30}
.dots button{width:7px;height:7px;border-radius:9px;border:0;background:rgba(255,255,255,.25);padding:0;transition:width .3s,background .3s}
.dots button.on{width:22px;background:var(--ac)}
body.lt .dots button{background:rgba(0,0,0,.15)}body.lt .dots button.on{background:var(--ac)}
@media (max-width:760px){.dots{display:none}}
.bar{position:fixed;left:0;top:0;height:3px;background:linear-gradient(90deg,var(--ac),var(--ac2));z-index:30;transition:width .45s ease}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:1fr}}
@media (max-width:600px){.g2{grid-template-columns:1fr}}
.two{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center}
@media (max-width:950px){.two{grid-template-columns:1fr;gap:30px}}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:22px;backdrop-filter:blur(6px)}
.light .card{background:#fff;border-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 34px rgba(28,23,20,.07)}
.card p{margin:0;color:var(--sub);font-size:14.5px}
.light .card p{color:var(--muted)}
.note{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;padding:9px 14px;border-radius:999px;background:rgba(255,90,31,.12);color:#FF9A70}
.light .note{color:var(--ac2)}
.note::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 4px rgba(255,90,31,.2)}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:14px;padding:15px 24px;font-weight:700;font-size:15.5px;text-decoration:none;transition:transform .2s,box-shadow .2s}
.cta:hover{transform:translateY(-2px)}
.cta.o{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 10px 30px rgba(232,37,31,.35)}
.cta.w{background:#fff;color:var(--ac2)}
.cta.g{background:transparent;border:1.5px solid rgba(255,255,255,.2);color:#fff}
.light .cta.g{border-color:var(--line);color:var(--fg)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* 1 capa */
.orbit{position:absolute;right:-6vw;top:50%;width:min(62vw,760px);aspect-ratio:1;transform:translateY(-50%);pointer-events:none;z-index:0}
.orbit .ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(255,90,31,.22)}
.orbit .ring.r2{inset:13%;border-color:rgba(255,255,255,.08)}
.orbit .ring.r3{inset:27%;background:radial-gradient(circle,rgba(255,90,31,.32),rgba(232,37,31,.05) 70%);border:0}
.orbit .spin{position:absolute;inset:0;animation:spin 40s linear infinite}
.orbit .dot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--ac);box-shadow:0 0 18px var(--ac)}
@keyframes spin{to{transform:rotate(360deg)}}
.chipf{position:absolute;background:#fff;color:var(--fg);border-radius:16px;padding:10px 14px;font-size:12.5px;font-weight:600;box-shadow:0 14px 40px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center;animation:flt 6s ease-in-out infinite;z-index:2}
.chipf i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-style:normal;color:#fff;font-size:14px;flex:none}
.chipf small{display:block;color:var(--muted);font-weight:500;font-size:11px}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media (max-width:950px){.orbit{opacity:.35;right:-30vw;width:90vw}.chipf{display:none}}
/* 2 diagnóstico */
.ecg{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:20px;height:96px;margin-bottom:14px;overflow:hidden}
.ecg path{fill:none;stroke:var(--ac);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(255,90,31,.6));stroke-dasharray:900;stroke-dashoffset:900}
.slide.on .ecg path{animation:ecg 2.6s linear infinite}
@keyframes ecg{0%{stroke-dashoffset:900}70%{stroke-dashoffset:0}100%{stroke-dashoffset:-900}}
.qs{display:grid;gap:10px}
.q{display:flex;gap:14px;align-items:flex-start;text-align:left;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:14px 16px;transition:background .25s,border-color .25s}
.q:hover,.q.sel{background:rgba(255,90,31,.1);border-color:rgba(255,90,31,.45)}
.q b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ac);display:grid;place-items:center;font-size:13px}
.q h3{font-size:15.5px;margin:2px 0 2px}.q p{margin:0;color:var(--sub);font-size:13px}
/* 3 objetivos */
.obj{position:relative;min-height:420px}
.bub{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,#3A2A22,#1B1411);border:1px solid rgba(255,255,255,.08);display:grid;place-items:center;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4);animation:flt 7s ease-in-out infinite}
.bub b{display:block;font-size:clamp(20px,2.4vw,30px);font-weight:800;color:#fff}
.bub span{font-size:11.5px;color:var(--sub);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.bub .meta{position:absolute;top:8%;right:8%;width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#0866FF,#5B9BFF);display:grid;place-items:center;font-size:13px;font-weight:800}
.big-o{position:absolute;right:-60px;top:-30px;width:220px;height:220px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;text-align:left;padding:40px;font-weight:800;line-height:1.05;font-size:18px;color:#fff;transform:rotate(-8deg)}
@media (max-width:950px){.obj{min-height:340px}.big-o{display:none}}
/* 4 números */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:800px){.stats{grid-template-columns:1fr}}
.stat{background:#fff;border-radius:20px;padding:24px;box-shadow:0 12px 34px rgba(28,23,20,.07)}
.stat:first-child{background:linear-gradient(150deg,var(--ac),var(--ac2));color:#fff}
.stat b{display:block;font-size:clamp(36px,4.4vw,54px);font-weight:800;letter-spacing:-.02em;line-height:1}
.stat p{margin:8px 0 0;color:var(--muted);font-size:14px}
.stat:first-child p{color:#FFE3D6}
.mq{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);margin-top:8px}
.mq .tr{display:flex;gap:18px;width:max-content;animation:mq 22s linear infinite}
.mq .lg{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(28,23,20,.08);flex:none}
.mq .lg img{max-width:78%;max-height:62%;object-fit:contain}
@keyframes mq{to{transform:translateX(-50%)}}
.hero-band{background:var(--ink);color:#fff;margin:-76px -32px 34px;padding:80px 32px 70px;text-align:center;border-radius:0 0 40px 40px}
@media (max-width:760px){.hero-band{margin:-66px -18px 26px;padding:70px 18px 50px}}
/* 5 resultados */
.res-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.kp{display:flex;gap:10px;flex-wrap:wrap}
.kp div{background:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 8px 24px rgba(28,23,20,.06);min-width:130px}
.kp b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.kp span{font-size:11.5px;color:var(--muted)}
.kp .up{color:var(--ok)}
.chart-w{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:stretch}
@media (max-width:950px){.chart-w{grid-template-columns:1fr}}
.chart{background:#fff;border-radius:22px;padding:22px 18px 14px;box-shadow:0 12px 34px rgba(28,23,20,.07);display:flex;flex-direction:column}
.bars{flex:1;display:flex;align-items:flex-end;gap:12px;min-height:260px;padding-top:34px;border-bottom:1px dashed var(--line)}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;cursor:pointer}
.bc .bv{font-size:12px;font-weight:700;margin-bottom:6px;opacity:0;transition:opacity .4s}
.bc .bg{width:100%;max-width:70px;border-radius:12px 12px 6px 6px;background:linear-gradient(180deg,#3A2A22,#1C1714);height:0;transition:height .9s cubic-bezier(.2,.7,.2,1);position:relative;overflow:hidden}
.bc .bg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--cpl,30%);background:linear-gradient(180deg,var(--amb),var(--ac2))}
.bc.rec .bg{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ac)}
.bc .tag{position:absolute;top:-4px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--ac);color:#fff;white-space:nowrap;opacity:0;transition:opacity .4s}
.bc .dl{font-size:10.5px;font-weight:700;color:var(--ok);background:#E3F4EA;border-radius:999px;padding:2px 7px;margin-bottom:4px;opacity:0;transition:opacity .4s}
.bc .bl{position:absolute;bottom:-26px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.chart.go .bv,.chart.go .tag,.chart.go .dl{opacity:1}
.bc.sel .bg{background:linear-gradient(180deg,#4A3329,#2A1F1A)}
.legend{display:flex;gap:16px;margin-top:34px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tbl{background:#fff;border-radius:22px;padding:8px 16px;box-shadow:0 12px 34px rgba(28,23,20,.07);font-size:13.5px}
.tbl table{width:100%;border-collapse:collapse}
.tbl th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:10px 6px;font-weight:600}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:10px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.sel td{background:#FFF3EC}
.tbl td b{font-weight:700}
.fn{margin-top:14px;font-size:13px;color:var(--muted);background:#fff;border-radius:14px;padding:12px 14px;border-left:3px solid var(--ac)}
.segtabs{display:flex;gap:6px;flex-wrap:wrap}
.segtabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
.segtabs button[aria-pressed=true]{background:var(--fg);border-color:var(--fg);color:#fff}
/* 6 método */
.metodo{display:grid;grid-template-columns:.9fr 1.4fr;gap:30px;align-items:center}
@media (max-width:950px){.metodo{grid-template-columns:1fr}}
.wheel{position:relative;width:100%;max-width:560px;aspect-ratio:1;margin:0 auto}
.wheel svg{position:absolute;inset:0;width:100%;height:100%}
.wheel .spin{transform-origin:50% 50%;animation:spin 60s linear infinite}
.pill{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.12);transition:transform .25s,box-shadow .25s}
.pill:hover{transform:translate(-50%,-50%) scale(1.06)}
.pill.o{background:var(--ac);color:#fff}.pill.k{background:var(--fg);color:#fff}
.pill.sel{box-shadow:0 0 0 4px #fff,0 0 0 6px var(--ac),0 10px 30px rgba(232,37,31,.35)}
@media (max-width:600px){.pill{font-size:11px;padding:7px 11px}}
.det{background:#fff;border-radius:20px;padding:22px;box-shadow:0 12px 34px rgba(28,23,20,.08);min-height:200px}
.det ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.det li{display:flex;gap:10px;font-size:14px;color:var(--muted)}
.det li::before{content:"✓";flex:none;width:20px;height:20px;border-radius:50%;background:#FFE7DC;color:var(--ac2);display:grid;place-items:center;font-size:11px;font-weight:800}
.det .tg{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);margin-bottom:6px}
.fade{animation:fd .4s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* 7 acompanhamento */
.feats{display:grid;gap:10px}
.fe{display:flex;gap:14px;align-items:flex-start;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 6px 20px rgba(28,23,20,.05);border:1.5px solid transparent;transition:border-color .3s,transform .3s;text-align:left;width:100%}
.fe.sel{border-color:var(--ac);transform:translateX(6px)}
.fe i{flex:none;width:36px;height:36px;border-radius:11px;background:#FFE7DC;display:grid;place-items:center;font-style:normal;color:var(--ac2);font-weight:800}
.fe h3{font-size:15px;margin:2px 0}.fe p{margin:0;color:var(--muted);font-size:13px}
.ph-w{position:relative;display:grid;place-items:center;padding:20px 0}
.ph-w::before{content:"";position:absolute;width:88%;aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(255,90,31,.25)}
.phone{position:relative;width:300px;max-width:84vw;background:#0D0A09;border-radius:40px;padding:12px;box-shadow:0 40px 90px rgba(28,23,20,.35);border:1px solid #2A221F}
.scr{background:#15110F;border-radius:30px;padding:18px 16px;color:#fff;min-height:500px;font-size:13px}
.scr .hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.scr .av{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-weight:800;font-size:12px}
.scr .live{margin-left:auto;font-size:10.5px;color:var(--okl);border:1px solid rgba(95,214,154,.4);padding:3px 8px;border-radius:999px;display:flex;gap:5px;align-items:center}
.scr .live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--okl);animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.25}}
.scr .t{font-size:10px;letter-spacing:.12em;color:var(--sub);text-transform:uppercase;margin:4px 0}
.scr h4{margin:0 0 12px;font-size:20px;line-height:1.2}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;background:#2A221F;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:600;color:var(--sub);white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--ac);color:#fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:#221B18;border-radius:14px;padding:12px}
.tile span{font-size:10.5px;color:var(--sub)}
.tile b{display:block;font-size:20px;font-weight:800;margin-top:2px}
.tile.w{grid-column:1/-1}
.tile.w b{font-size:30px;color:var(--ac)}
.tile .ok{font-size:11px;color:var(--okl)}
.upd{font-size:10.5px;color:var(--sub);margin-top:10px}
.toast{position:absolute;background:#fff;color:var(--fg);border-radius:14px;padding:10px 12px;font-size:12px;font-weight:600;box-shadow:0 16px 40px rgba(28,23,20,.25);max-width:220px;opacity:0;transform:translateY(10px) scale(.96);transition:all .5s cubic-bezier(.2,.7,.2,1);z-index:3}
.toast small{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.toast.show{opacity:1;transform:none}
.toast.wa{background:#DCF8C6}
@media (max-width:950px){.toast{display:none}}
/* 8 orçamento */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
@media (max-width:600px){.vs{grid-template-columns:1fr}}
.vs .card ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:9px}
.vs li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px}
.vs li b{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px}
.vs .no{opacity:.75}
.vs .no li{text-decoration:line-through;text-decoration-color:rgba(255,138,128,.6);color:var(--sub)}
.vs .no b{background:#3A2A26;color:#FF8A80}
.vs .yes{background:linear-gradient(160deg,rgba(255,90,31,.14),rgba(232,37,31,.05));border-color:rgba(255,90,31,.5)}
.vs .yes b{background:var(--ac);color:#fff}
.vs h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sub)}
.vs .yes h3{color:var(--ac)}
.form-ph .scr{background:#fff;color:var(--fg);padding:0;overflow:hidden}
.fp-top{background:linear-gradient(150deg,var(--ac),var(--ac2));color:#fff;padding:18px 16px 16px}
.fp-top small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.fp-top b{display:block;font-size:17px;margin-top:2px}
.fp{padding:14px 16px}

  /* ---------------- interações por diapositivo ---------------- */
  const timers = [];
  const limpar = () => { while (timers.length) { const t = timers.pop(); clearTimeout(t); clearInterval(t); } };
  function entrar(el, S, d){
    limpar();
    el.querySelectorAll("[data-cnt]").forEach(b => { const v = Number(b.dataset.cnt), dec = Number(b.dataset.dec || 0); contar(b, v, 1500, x => (b.dataset.pre || "") + nf(x, dec) + (b.dataset.suf || "")); });

    if (S.fim) { const ms = [...el.querySelectorAll("#months i")], min = Number(d.modelo?.meses_minimo || 3); ms.forEach(i => i.className = ""); ms.forEach((i, k) => timers.push(setTimeout(() => i.className = k < min ? "on" : "mm", 700 + k * 110))); }
  }
  function resultados(el, d, idx){
    const casos = (d.casos || []).filter(c => (c.semanas || []).length >= 2), c = casos[idx]; if (!c) return;
    const W = c.semanas, maxP = Math.max(1, ...W.map(w => w.pedidos)), maxG = Math.max(1, ...W.map(w => w.gasto));
    const p0 = W[0], pN = W[W.length - 1], best = W.reduce((a, b) => b.pedidos > a.pedidos ? b : a, W[0]);
    const cpl = w => w.pedidos ? w.gasto / w.pedidos : null, c0 = cpl(W.find(w => w.pedidos > 0) || p0), cB = Math.min(...W.filter(w => w.pedidos).map(cpl));
    const tot = W.reduce((s, w) => s + w.pedidos, 0);
    el.querySelector("#resKp").innerHTML = `<div><b>${p0.pedidos} → ${best.pedidos}</b><span>pedidos por semana · início → melhor</span></div>
      <div><b class="up">${c0 && cB ? "−" + Math.round((1 - cB / c0) * 100) + "%" : "—"}</b><span>custo por pedido</span></div><div><b>${tot}</b><span>pedidos em ${W.length} semanas</span></div>`;
    const chart = el.querySelector("#chart"); chart.classList.remove("go");
    el.querySelector("#bars").innerHTML = W.map((w, i) => { const dv = i && p0.pedidos ? Math.round((w.pedidos / p0.pedidos - 1) * 100) : null;
      return `<div class="bc ${w === best ? "rec" : ""}" data-w="${i}">${w === best ? `<span class="tag">★ recorde</span>` : ""}${dv != null ? `<span class="dl" style="${dv < 0 ? "color:#B3261E;background:#FBE6E4" : ""}">${dv >= 0 ? "+" : ""}${dv}%</span>` : `<span class="dl" style="color:var(--muted);background:#F1ECE8">início</span>`}
        <span class="bv">${w.pedidos}</span><div class="bg" style="--cpl:${Math.round(w.gasto / maxG * 38)}%" data-h="${Math.max(4, w.pedidos / maxP * 100)}"></div><span class="bl">${semLbl(w.sem)}</span></div>`; }).join("");
    el.querySelector("#resTbl").innerHTML = `<table><thead><tr><th>Semana</th><th>Investido</th><th>Pedidos</th><th>Custo/pedido</th></tr></thead><tbody>${W.map((w, i) => `<tr data-w="${i}"><td>${semLbl(w.sem)}</td><td>${eur2(w.gasto)}</td><td><b>${w.pedidos}</b></td><td>${cpl(w) ? eur2(cpl(w)) : "—"}</td></tr>`).join("")}</tbody></table>`;

    bars.forEach((b, i) => timers.push(setTimeout(() => b.style.height = b.dataset.h + "%", 350 + i * 140)));

  function mercado(el, d){
    const lns = [...el.querySelectorAll(".recibo .ln")], itens = d.modelo?.itens || [], tot = Number(d.valor_mercado) || itens.reduce((s, i) => s + Number(i.valor || 0), 0);

  function acomp(el, d){
    const c = (d.casos || [])[0]?.semanas || [], w = c[c.length - 1] || {gasto: 35.48, pedidos: 12, cliques: 98, impressoes: 7715};

  function iniciar(d){
    const S = slides(d);
    deck.innerHTML = S.map((s, i) => `<section class="slide ${s.cls}" data-i="${i}" aria-label="Diapositivo ${i + 1} de ${S.length}">${s.html}</section>`).join("");
    const els = [...deck.querySelectorAll(".slide")], nav = document.getElementById("nav"), bar = document.getElementById("bar"), count = document.getElementById("count"), top = document.getElementById("topLogo"), dots = document.getElementById("dots");
    nav.hidden = false;
    dots.innerHTML = els.map((_, i) => `<button type="button" aria-label="Diapositivo ${i + 1}"></button>`).join("");
    dots.onclick = e => { const b = e.target.closest("button"); if (b) ir([...dots.children].indexOf(b)); };
    let cur = -1;
    const ir = n => {
      n = Math.max(0, Math.min(els.length - 1, n)); if (n === cur) return;
      els.forEach((e, i) => e.classList.toggle("on", i === n));
      cur = n; els[n].scrollTop = 0;
      count.textContent = `${n + 1} / ${els.length}`; bar.style.width = ((n + 1) / els.length * 100) + "%";
      [...dots.children].forEach((b, i) => b.classList.toggle("on", i === n));
      document.getElementById("prev").disabled = n === 0; document.getElementById("next").disabled = n === els.length - 1;
      document.body.classList.toggle("lt", !!S[n].lt); top.classList.toggle("hide", n === 0);
      try { history.replaceState(null, "", "#" + (n + 1)); } catch(_){}
      entrar(els[n], S[n], d);
    };
    document.getElementById("prev").onclick = () => ir(cur - 1);
    document.getElementById("next").onclick = () => ir(cur + 1);
    document.addEventListener("keydown", e => { if (document.querySelector(".scrim") || /INPUT|TEXTAREA/.test(document.activeElement?.tagName)) return; if (["ArrowRight","PageDown"," "].includes(e.key)) { e.preventDefault(); ir(cur + 1); } if (["ArrowLeft","PageUp"].includes(e.key)) { e.preventDefault(); ir(cur - 1); } });
    let x0 = null, y0 = null;
    deck.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
    deck.addEventListener("touchend", e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) ir(cur + (dx < 0 ? 1 : -1)); x0 = null; }, {passive:true});
    deck.addEventListener("click", e => {
      const t = e.target;
      const g = t.closest("[data-go]"); if (g) { ir(g.dataset.go.startsWith("+") ? cur + 1 : Number(g.dataset.go)); return; }
      const q = t.closest("[data-q]"); if (q) { q.parentNode.querySelectorAll(".q").forEach(x => x.classList.toggle("sel", x === q)); return; }
      const sg = t.closest("[data-seg]"); if (sg) { sg.parentNode.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === sg)); limpar(); resultados(els[cur], d, Number(sg.dataset.seg)); return; }
      const bc = t.closest(".bc[data-w],tr[data-w]"); if (bc) { const i = bc.dataset.w; els[cur].querySelectorAll("[data-w]").forEach(x => x.classList.toggle("sel", x.dataset.w === i)); return; }
      const mt = t.closest("[data-met]"); if (mt) { met(mt.dataset.met); return; }
      const fe = t.closest("[data-fe]"); if (fe) { fe.parentNode.querySelectorAll(".fe").forEach(x => x.classList.toggle("sel", x === fe)); return; }
      const ch = t.closest(".ch button"); if (ch) { ch.parentNode.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === ch)); return; }
      if (t.closest("#fpGo")) { const sl = els[cur], v = k => sl.querySelector(`[data-grp=${k}] [aria-pressed=true]`)?.textContent || ""; sl.querySelector("#fpRes").textContent = `${v("s")} · ${v("z")} · ${v("q")}${sl.querySelector("#fpN").value ? " · " + sl.querySelector("#fpN").value : ""}`; sl.querySelector("#fpOk").classList.add("show"); setTimeout(() => sl.querySelector("#b0").classList.add("show"), 400); setTimeout(() => sl.querySelector("#b1").classList.add("show"), 900); return; }
      if (t.closest("#fpAgain")) { const sl = els[cur]; sl.querySelector("#fpOk").classList.remove("show"); ["b0","b1"].forEach(i => sl.querySelector("#" + i).classList.remove("show")); return; }
    });
    const met = k => { const [tg, p, l] = METODO[k]; document.querySelectorAll("[data-met]").forEach(b => b.classList.toggle("sel", b.dataset.met === k)); const det = document.getElementById("metDet"); det.innerHTML = `<div class="fade"><span class="tg">${tg}</span><h3 style="font-size:21px">${k}</h3><p style="color:var(--muted);margin:0">${p}</p><ul>${l.map(x => `<li>${x}</li>`).join("")}</ul></div>`; };
    met("Atração");
    ctas(d);
    const h = parseInt(location.hash.slice(1)); ir(isFinite(h) ? h - 1 : 0);
  }
  function ctas(d){
    const tel = String(d.agencia?.telefone || "").replace(/\D/g, ""), wa = tel ? "https://wa.me/" + (tel.length === 9 ? "351" + tel : tel) + "?text=" + encodeURIComponent("Olá Angélica! Vi a proposta da Métrica Digital e tenho uma dúvida.") : "";
    const venc = d.validade && d.validade < new Date().toISOString().slice(0, 10);
    const html = d.estado === "aceite"
      ? `<span class="aceite">✓ Proposta aceite${d.aceite_em ? " a " + new Date(d.aceite_em).toLocaleDateString("pt-PT") : ""}. Vai receber o contrato em breve.</span>`
      : venc ? `<span class="note">Esta condição já terminou. Fale connosco para uma nova proposta.</span>${wa ? `<a class="cta g" href="${wa}" target="_blank" rel="noopener">Falar no WhatsApp</a>` : ""}`
      : `<button class="cta o" type="button" data-aceitar>Aceitar a proposta</button>${wa ? `<a class="cta g" href="${wa}" target="_blank" rel="noopener">Tenho uma dúvida</a>` : ""}`;
    ["ctaBox", "ctaBox2"].forEach(id => { const b = document.getElementById(id); if (b) b.innerHTML = id === "ctaBox" ? html.replace('cta g"', 'cta g" style="color:var(--fg);border-color:var(--line)"') : html; });
    document.querySelectorAll("[data-aceitar]").forEach(b => b.onclick = () => aceitar(d));
  }
  function aceitar(d){
    const sc = document.createElement("div"); sc.className = "scrim";
    sc.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">Aceitar a proposta</h3>
      <p style="color:var(--muted);margin:0">${eur(d.valor)} por mês${d.empresa ? " · " + esc(d.empresa) : ""}. A seguir enviamos-lhe o contrato para assinar online.</p>
      <label for="an">O seu nome</label><input id="an" value="${esc(d.nome)}" autocomplete="name">
      <div class="err" id="ae" hidden></div>
      <div class="row" style="margin-top:18px;justify-content:flex-end"><button class="cta g" style="color:var(--fg);border-color:var(--line)" type="button" id="ac">Cancelar</button><button class="cta o" type="button" id="ao">Confirmar</button></div></div>`;
    document.body.appendChild(sc);
    const fechar = () => sc.remove();
    sc.addEventListener("click", e => { if (e.target === sc) fechar(); });
    document.getElementById("ac").onclick = fechar; document.getElementById("an").focus();
    document.getElementById("ao").onclick = async () => {
      const b = document.getElementById("ao"), nm = document.getElementById("an").value.trim();
      if (nm.length < 2) { const e = document.getElementById("ae"); e.hidden = false; e.textContent = "Escreva o seu nome."; return; }
      b.disabled = true; b.textContent = "A confirmar…";
      try {
        const r = await rpc("proposta_aceitar", {p_token: token, p_nome: nm});
        if (r.erro) throw new Error(r.erro === "expirada" ? "Esta condição já terminou. Fale connosco para uma nova proposta." : "Não foi possível confirmar.");
        fechar(); d.estado = "aceite"; d.aceite_em = r.aceite_em; ctas(d);
      } catch(err){ const e = document.getElementById("ae"); e.hidden = false; e.textContent = err.message === "rede" ? "Sem ligação. Tente de novo." : err.message; b.disabled = false; b.textContent = "Confirmar"; }
    };
  }
  (async () => {
    if (!/^[a-f0-9]{24,64}$/.test(token)) { deck.innerHTML = `<div class="loading">Este link de proposta não está completo.</div>`; return; }
    try {
      const d = await rpc("proposta_ver", {p_token: token});
      if (d.erro) { deck.innerHTML = `<div class="loading">Esta proposta já não está disponível.<br>Fale com a Métrica Digital.</div>`; return; }
      iniciar(d);
    } catch(_){ deck.innerHTML = `<div class="loading">Não foi possível carregar a proposta. Tente de novo.</div>`; }
  })();
})();
</script>
